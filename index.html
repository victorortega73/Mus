<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mus">
    <meta name="theme-color" content="#0a3d2a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <title>Contador de Mus</title>
</head>
<body>
    <div class="app">
        
        <!-- EQUIPO 1 (IZQUIERDA) -->
        <div class="equipo equipo-1" id="equipo1">
            <div class="nombre-equipo">NOSOTROS</div>
            <div class="puntos" id="puntos1">0</div>
            <div class="label">puntos</div>
            <div class="juegos-zona">
                <button class="btn-juego-menos" data-equipo="equipo1">−</button>
                <div class="juegos">Juegos: <span id="juegos1">0</span></div>
                <button class="btn-juego-mas" data-equipo="equipo1">+</button>
            </div>
        </div>

        <!-- ZONA CENTRAL: APUESTAS DE LA RONDA -->
        <div class="centro">
            <button class="btn-reset" id="btn-reset">Reiniciar</button>
            
            <div class="apuestas">
                <div class="apuesta" data-tipo="grande">
                    <button class="apuesta-btn izq" data-tipo="grande" data-equipo="equipo1">◀</button>
                    <div class="apuesta-info">
                        <div class="apuesta-label">GRANDE</div>
                        <div class="apuesta-valor" id="apuesta-grande">0</div>
                    </div>
                    <button class="apuesta-btn der" data-tipo="grande" data-equipo="equipo2">▶</button>
                </div>
                
                <div class="apuesta" data-tipo="chica">
                    <button class="apuesta-btn izq" data-tipo="chica" data-equipo="equipo1">◀</button>
                    <div class="apuesta-info">
                        <div class="apuesta-label">CHICA</div>
                        <div class="apuesta-valor" id="apuesta-chica">0</div>
                    </div>
                    <button class="apuesta-btn der" data-tipo="chica" data-equipo="equipo2">▶</button>
                </div>
                
                <div class="apuesta" data-tipo="pares">
                    <button class="apuesta-btn izq" data-tipo="pares" data-equipo="equipo1">◀</button>
                    <div class="apuesta-info">
                        <div class="apuesta-label">PARES</div>
                        <div class="apuesta-valor" id="apuesta-pares">0</div>
                    </div>
                    <button class="apuesta-btn der" data-tipo="pares" data-equipo="equipo2">▶</button>
                </div>
                
                <div class="apuesta" data-tipo="juego">
                    <button class="apuesta-btn izq" data-tipo="juego" data-equipo="equipo1">◀</button>
                    <div class="apuesta-info">
                        <div class="apuesta-label">JUEGO</div>
                        <div class="apuesta-valor" id="apuesta-juego">0</div>
                    </div>
                    <button class="apuesta-btn der" data-tipo="juego" data-equipo="equipo2">▶</button>
                </div>
            </div>
            
            <div class="ayuda">Toca para +1 · Desliza ↓ para −1 · Mantén pulsado para reset</div>
        </div>

        <!-- EQUIPO 2 (DERECHA) -->
        <div class="equipo equipo-2" id="equipo2">
            <div class="nombre-equipo">ELLOS</div>
            <div class="puntos" id="puntos2">0</div>
            <div class="label">puntos</div>
            <div class="juegos-zona">
                <button class="btn-juego-menos" data-equipo="equipo2">−</button>
                <div class="juegos">Juegos: <span id="juegos2">0</span></div>
                <button class="btn-juego-mas" data-equipo="equipo2">+</button>
            </div>
        </div>

    </div>

    <!-- Diálogo para confirmar reinicio -->
    <div class="modal" id="modal-reset">
        <div class="modal-contenido">
            <p>¿Qué quieres reiniciar?</p>
            <button id="reset-puntos">Solo puntos</button>
            <button id="reset-todo">Todo (también juegos)</button>
            <button id="reset-cancelar" class="cancelar">Cancelar</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrado'))
                    .catch(err => console.log('Error SW:', err));
            });
        }
    </script>
</body>
</html>
